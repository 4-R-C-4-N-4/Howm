name: CI

on:
  push:
    branches: [main, develop, p2pcd-v4]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # ─────────────────────────────────────────────
  # Lint & Format
  # ─────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            node/target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('node/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-lint-

      - name: Check formatting
        working-directory: node
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: node
        run: cargo clippy --all-targets --all-features -- -D warnings

  # ─────────────────────────────────────────────
  # Web UI — build and upload dist artifact
  # ─────────────────────────────────────────────
  build-ui:
    name: Build Web UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: ui/web/package-lock.json

      - name: Install dependencies
        working-directory: ui/web
        run: npm ci

      - name: Lint
        working-directory: ui/web
        run: npm run lint --if-present

      - name: Build
        working-directory: ui/web
        run: npm run build

      - name: Upload UI dist
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist-ci
          path: ui/web/dist
          retention-days: 3
          if-no-files-found: error

  # ─────────────────────────────────────────────
  # Build & Test (matrix) — needs UI dist so
  # include_dir! embeds the real UI
  # ─────────────────────────────────────────────
  build:
    name: Build & Test (${{ matrix.os }})
    needs: [build-ui]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Download UI dist
        uses: actions/download-artifact@v4
        with:
          name: ui-dist-ci
          path: ui/web/dist

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            node/target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('node/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Build
        working-directory: node
        run: cargo build --release --target ${{ matrix.target }}

      - name: Run unit tests
        working-directory: node
        run: cargo test --release --target ${{ matrix.target }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: howm-${{ matrix.target }}
          path: |
            node/target/${{ matrix.target }}/release/howm
            node/target/${{ matrix.target }}/release/howm.exe
          if-no-files-found: error
          retention-days: 7

  # ─────────────────────────────────────────────
  # Capabilities — build + test each cap crate.
  # Previously NOT covered by CI: the world cap's
  # large test suite never ran. RUSTFLAGS is relaxed
  # here (caps still carry pre-existing dead-code
  # warnings); the node/ lint job keeps -D warnings.
  # ─────────────────────────────────────────────
  capabilities:
    name: Capabilities Build & Test
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-caps-${{ hashFiles('capabilities/*/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-caps-

      - name: Type-check & bundle world UI (astral)
        working-directory: capabilities/world/astral-src
        run: |
          npx --yes -p typescript@5.9.3 tsc --noEmit -p tsconfig.json
          npx --yes esbuild src/entry.ts --bundle --outfile=../ui/astral.js \
            --format=iife --platform=browser --target=es2020

      - name: Build & test each capability
        run: |
          set -e
          for cap in capabilities/*/Cargo.toml; do
            dir="$(dirname "$cap")"
            echo "::group::$dir"
            (cd "$dir" && cargo build && cargo test)
            echo "::endgroup::"
          done
